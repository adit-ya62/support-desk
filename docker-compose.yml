services:
  db:
    image: mysql:8.4
    container_name: supportdesk-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: supportdesk
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: supportdesk-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/supportdesk?allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: "change-this-to-a-long-random-secret-at-least-32-chars"
    ports:
      - "8080:8080"

volumes:
  db_data: